name: Validate EDA Stack

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  dashboard-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: |
            apps/studio-web/package-lock.json
            tests/browser/package-lock.json
      - run: python -m pip install -e .
      - run: npm ci
        working-directory: apps/studio-web
      - run: npm ci
        working-directory: tests/browser
      - run: npx playwright install --with-deps chromium
        working-directory: tests/browser
      - run: npm test
        working-directory: tests/browser
        env:
          EDA_PYTHON: python
          EDA_BROWSER_CHANNEL: chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: dashboard-browser-failures
          path: tests/browser/test-results/
          retention-days: 14

  studio-api:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python-version: ['3.10', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - if: matrix.python-version == '3.10'
        run: python -m pip install pytest==9.2.0 jsonschema==4.26.0 httpx==0.28.1
      - if: matrix.python-version != '3.10'
        run: python -m pip install -r requirements-dev.txt
      - name: Run mandatory Studio API and contract tests
        run: python -m pytest -q tests/test_studio_api.py tests/test_studio_contracts.py

  studio-real-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: |
            apps/studio-web/package-lock.json
            tests/browser/package-lock.json
            packages/tscircuit-worker/package-lock.json
      - run: python -m pip install -e . -r requirements-dev.txt
      - run: npm ci
        working-directory: apps/studio-web
      - run: npm ci
        working-directory: tests/browser
      - run: npm ci
        working-directory: packages/tscircuit-worker
      - name: Build pinned TSX sandbox image
        run: npm run sandbox:image
        working-directory: packages/tscircuit-worker
      - run: npx playwright install --with-deps chromium
        working-directory: tests/browser
      - name: Compile the voltage-divider project through the real browser and API
        run: npm test -- --grep "real Studio API compiles"
        working-directory: tests/browser
        env:
          EDA_PYTHON: python
          EDA_BROWSER_CHANNEL: chromium
          EDA_STUDIO_REAL_E2E: '1'
          EDA_STUDIO_TEST_API_PORT: '8766'
          EDA_STUDIO_DEV_API_TARGET: http://127.0.0.1:8766

  kicad-worker-unit:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: packages/tscircuit-worker/package-lock.json
      - run: npm install --global npm@11.12.1
      - run: npm ci
        working-directory: packages/tscircuit-worker
      - run: npm test
        working-directory: packages/tscircuit-worker
      - run: npm run build
        working-directory: packages/tscircuit-worker

  kicad-worker-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: |
            integrations/tscircuit-rc/package-lock.json
            packages/tscircuit-worker/package-lock.json
            packages/tscircuit-compiler/package-lock.json
      - run: npm install --global npm@11.12.1
      - run: npm ci
        working-directory: integrations/tscircuit-rc
      - run: npm ci
        working-directory: packages/tscircuit-worker
      - name: Build digest-pinned TSX sandbox image
        run: npm run sandbox:image
        working-directory: packages/tscircuit-worker
      - name: Export with KiCad and compare native pin-net membership
        run: npm run verify:native
        working-directory: packages/tscircuit-worker
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kicad-worker-native-evidence
          path: build/tscircuit-worker-native-*/
          retention-days: 30

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check src tests

  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python-version: ['3.10', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - if: matrix.python-version == '3.10'
        run: python -m pip install -e .
      - if: matrix.python-version == '3.10'
        run: python -m pip install pytest==9.2.0 jsonschema==4.26.0 httpx==0.28.1
      - if: matrix.python-version != '3.10'
        run: python -m pip install -e . -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v

  real-ngspice:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: integrations/tscircuit-rc/package-lock.json
      - run: npm install --global npm@11.12.1
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ngspice=42+ds-3build1
      - run: python -m pip install -e . -r requirements-dev.txt
      - run: ngspice -v
      - run: edastack doctor
      - name: Record integration toolchain
        run: |
          mkdir -p build
          python --version > build/toolchain.txt
          python -m pip freeze >> build/toolchain.txt
          node --version >> build/toolchain.txt
          npm --version >> build/toolchain.txt
          ngspice -v >> build/toolchain.txt 2>&1
          edastack doctor >> build/toolchain.txt
      - name: Run full suite with real ngspice
        run: |
          mkdir -p build
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee build/unittest.log
      - run: edastack verify examples/rc_filter/spec.json --out build/rc_filter
      - run: edastack verify examples/diode_clamp/spec.json --out build/diode_clamp
      - name: Install pinned tscircuit dependencies
        working-directory: integrations/tscircuit-rc
        run: npm ci
      - name: Run tscircuit integration checks
        working-directory: integrations/tscircuit-rc
        run: npm test
      - name: Validate KiCad interchange and manufacturing exports
        working-directory: integrations/tscircuit-rc
        run: npm run kicad:validate
      - name: Enforce zero ERC/DRC for reviewed RC reference only
        # General converted designs are compatibility fixtures, not release candidates.
        # General candidate release uses packages/tscircuit-worker release:check --kind general.
        working-directory: packages/tscircuit-worker
        run: |
          npm ci
          npm run release:check -- --kind reviewed-rc --summary ../../build/tscircuit-rc/kicad-validation/summary.json
      - name: Verify tscircuit source against real ngspice
        working-directory: integrations/tscircuit-rc
        run: npm run verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spice-verification-reports
          path: build/
          retention-days: 30
