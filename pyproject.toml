[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edastack"
version = "0.1.0"
description = "Local-first SPICE verification and AI-agent tooling for code-first electronics design"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "EDA Stack Starter contributors"}]
dependencies = [
    "fastapi==0.162.2",
    "uvicorn==0.54.0",
]

[project.scripts]
edastack = "edastack.cli:main"
edastack-mcp = "edastack.mcp:main"
edastack-studio = "edastack.studio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
edastack = ["dashboard_ui.html"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
